<!doctype html>
<html lang="en">
<head>
    <!-- CSS: factory_reset -->
</head>
<body>
    <p>Reseting the device means that you'll have to reconfigure the device using the <code>P1-Meter-Setup</code> WiFi.</p>
    <button id="reset">Factory Reset</button>
    <p class="status" id="status" role="status"></p>
    <div class="overlay" id="restart_overlay" hidden>
        <div class="panel">
            <h2>Device is reseting and restarting</h2>
            <p>You will need to use the P1-Meter-Setup WiFi, open browser at 192.168.4.1 and reconfigure the device.</p>
            <p id="retry_status">Waiting for the device…</p>
        </div>
    </div>
    <!-- P1METER_ATTRIBUTION -->
    <!-- JS: factory_reset -->
</body>
</html>
