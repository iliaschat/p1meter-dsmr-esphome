      unit_of_measurement: kWh
      device_class: energy
      state_class: total_increasing
    energy_delivered_tariff2_il:
      name: "Energy Consumed Tariff 2 IL"
      unit_of_measurement: kWh
      device_class: energy
      state_class: total_increasing
    energy_delivered_tariff3_il:
      name: "Energy Consumed Tariff 3 IL"
      unit_of_measurement: kWh
      device_class: energy
      state_class: total_increasing

    # Active Energy Returned
    energy_returned_tariff1:
      name: "Energy Returned Tariff 1"
      unit_of_measurement: kWh
      device_class: energy
      state_class: total_increasing
    energy_returned_tariff2:
      name: "Energy Returned Tariff 2"
      unit_of_measurement: kWh
      device_class: energy
      state_class: total_increasing
    energy_returned_tariff3:
      name: "Energy Returned Tariff 3"
      unit_of_measurement: kWh
      device_class: energy
      state_class: total_increasing
    energy_returned_tariff4:
      name: "Energy Returned Tariff 4"
      unit_of_measurement: kWh
      device_class: energy
      state_class: total_increasing
    energy_returned_lux:
      name: "Energy Returned Lux"
      unit_of_measurement: kWh
      device_class: energy
      state_class: total_increasing
    energy_returned_tariff1_ch:
      name: "Energy Returned Tariff 1 CH"
      unit_of_measurement: kWh
