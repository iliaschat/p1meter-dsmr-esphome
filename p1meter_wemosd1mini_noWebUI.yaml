      device_class: duration
      state_class: measurement

text_sensor:
  - platform: dsmr
    timestamp:
      name: "DSMR Timestamp"
      internal: true
    identification:
      name: "P1 Meter ID"
    p1_version:
      name: "P1 Version"
    p1_version_be:
      name: "P1 Version BE"
    electricity_switch_position:
      name: "Electricity Switch Position"
    electricity_tariff:
      name: "Actual Tariff Group"
    electricity_tariff_il:
      name: "Actual Tariff Group IL"
    electricity_failure_log:
      name: "Power Outages Log"
    electricity_failure_log_il:
      name: "Power Outages Log IL"
    message_short:
      name: "Text Message Short"
    message_long:
      name: "Text Message Long"
    equipment_id:
      name: "Electricity Equipment ID"
    gas_equipment_id:
      name: "Gas Equipment ID"
    gas_equipment_id_be:
      name: "Gas Equipment ID BE"
    thermal_equipment_id:
      name: "Thermal Equipment ID"
    water_equipment_id:
      name: "Water Equipment ID"
    sub_equipment_id:
      name: "Sub Equipment ID"
    gas_delivered_text:
      name: "Gas Delivered Text"
    fw_core_checksum:
      name: "Firmware Core Checksum"
    fw_core_version:
      name: "Firmware Core Version"
    fw_module_checksum:
      name: "Firmware Module Checksum"
    fw_module_version:
      name: "Firmware Module Version"
    telegram:
      name: "DSMR Telegram"
      internal: true
  - platform: template
    name: "Firmware Version"
    lambda: return std::string("0.4.0 (Standard)");

switch:
  - platform: gpio
    id: wifi_led
    pin:
      number: GPIO2
      inverted: true
    internal: true
  - platform: template
    name: "MQTT"
    id: mqtt_switch
    lambda: return id(mqtt_enabled);
    turn_on_action:
      - globals.set:
          id: mqtt_enabled
          value: "true"
      - mqtt.enable:
    turn_off_action:
      - globals.set:
          id: mqtt_enabled
          value: "false"
      - mqtt.disable:
  - platform: restart
    name: "Reboot"

interval:
  - interval: 1s
    then:
      - if:
          condition:
            not:
              wifi.connected:
          then:
            - switch.toggle: wifi_led

ota:
  - platform: esphome
    password: !secret p1meter__ota_password

logger:
  level: INFO
  baud_rate: 0
