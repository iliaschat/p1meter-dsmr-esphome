    energy_returned_tariff2_ch:
      name: "Energy Returned Tariff 2 CH"
      unit_of_measurement: kWh
      device_class: energy
      state_class: total_increasing
    energy_returned_tariff1_il:
      name: "Energy Returned Tariff 1 IL"
      unit_of_measurement: kWh
      device_class: energy
      state_class: total_increasing
    energy_returned_tariff2_il:
