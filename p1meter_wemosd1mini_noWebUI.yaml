      device_class: duration
      state_class: measurement
    voltage_swell_time_l3:
      name: "Voltage Swell Time Phase 3"
      device_class: duration
      state_class: measurement
    voltage_swell_l1:
      name: "Voltage Swell Phase 1"
      device_class: voltage
      state_class: measurement
    voltage_swell_l2:
      name: "Voltage Swell Phase 2"
      device_class: voltage
      state_class: measurement
    voltage_swell_l3:
      name: "Voltage Swell Phase 3"
      device_class: voltage
      state_class: measurement
    period_3_for_instantaneous_values:
