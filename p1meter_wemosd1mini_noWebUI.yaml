      device_class: power
      state_class: measurement
    active_energy_export_last_completed_demand:
      name: "Active Export Last Completed Demand"
      unit_of_measurement: kW
      device_class: power
      state_class: measurement
    reactive_energy_import_last_completed_demand:
      name: "Reactive Import Last Completed Demand"
      device_class: reactive_power
      state_class: measurement
    reactive_energy_export_last_completed_demand:
      name: "Reactive Export Last Completed Demand"
      device_class: reactive_power
      state_class: measurement
    apparent_energy_import_last_completed_demand:
      name: "Apparent Import Last Completed Demand"
