#  Advanced firmware for the NodeMCU v2 (ESP8266, nodemcuv2 board). Shared config: ../../p1meter_common.yaml
esphome:
  platformio_options:
    board_build.ldscript: eagle.flash.4m1m.ld

esp8266:
  board: nodemcuv2
  restore_from_flash: true

output:
  - platform: gpio
    id: wifi_led_output
    pin:
      number: GPIO2
      inverted: true

light:
  - platform: binary
    id: wifi_led
    output: wifi_led_output
    internal: true

p1_setup:
  device_model: "NodeMCU v2"

packages:
  common: !include ../../p1meter_common.yaml
  variant: !include ../p1meter_advanced.yaml
