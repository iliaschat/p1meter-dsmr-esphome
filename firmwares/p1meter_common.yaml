text_sensor:
  - platform: dsmr
    timestamp:
      name: "DSMR Timestamp"
      internal: true
    identification:
      name: "P1 Meter ID"
    p1_version:
      name: "P1 Version"
    p1_version_be:
      name: "P1 Version BE"
    electricity_switch_position:
      name: "Electricity Switch Position"
    electricity_tariff:
      name: "Actual Tariff Group"
    electricity_tariff_il:
      name: "Actual Tariff Group IL"
    electricity_failure_log:
      name: "Power Outages Log"
    electricity_failure_log_il:
      name: "Power Outages Log IL"
    message_short:
      name: "Text Message Short"
    message_long:
      name: "Text Message Long"
    equipment_id:
      name: "Electricity Equipment ID"
    gas_equipment_id:
      name: "Gas Equipment ID"
    gas_equipment_id_be:
      name: "Gas Equipment ID BE"
    thermal_equipment_id:
