    gas_delivered_text:
      name: "Gas Delivered Text"
    fw_core_checksum:
      name: "Firmware Core Checksum"
    fw_core_version:
      name: "Firmware Core Version"
    fw_module_checksum:
      name: "Firmware Module Checksum"
    fw_module_version:
      name: "Firmware Module Version"
    telegram:
      name: "DSMR Telegram"
      internal: true
  - platform: template
    name: "Firmware Version"
    lambda: return std::string("${firmware_version} (${firmware_type})");

web_server:
  port: 80
  version: 3
  auth:
    username: "p1meter"
    type: digest

p1_setup:
  id: p1_setup_control
  mqtt_id: mqtt_client
  device_name: "P1 Meter"
  login_username: "p1meter" # Must match web_server.auth.username

switch:
  - platform: template
    name: "MQTT"
    id: mqtt_switch
    lambda: return id(p1_setup_control).mqtt_enabled();
    turn_on_action:
      - lambda: id(p1_setup_control).set_mqtt_enabled(true);
    turn_off_action:
      - lambda: id(p1_setup_control).set_mqtt_enabled(false);
  - platform: template
    name: "HomeWizard"
    id: homewizard_switch
    lambda: return id(p1_setup_control).homewizard_enabled();
    turn_on_action:
      - lambda: id(p1_setup_control).set_homewizard_enabled(true);
    turn_off_action:
      - lambda: id(p1_setup_control).set_homewizard_enabled(false);
  - platform: template
    name: "ESPHome API"
    id: api_switch
    lambda: return id(p1_setup_control).api_enabled();
    turn_on_action:
      - lambda: id(p1_setup_control).set_api_enabled(true);
    turn_off_action:
      - lambda: id(p1_setup_control).set_api_enabled(false);
  - platform: restart
    name: "Reboot"

interval:
  - interval: 250ms
    then:
      - if:
          condition:
            wifi.ap_active:
          then:
            - light.toggle: wifi_led
  - interval: 1s
    then:
      - if:
          condition:
            all:
              - not:
                  wifi.connected:
              - not:
                  wifi.ap_active:
          then:
            - light.toggle: wifi_led

ota:
  - platform: web_server

logger:
  level: INFO
  baud_rate: 0
